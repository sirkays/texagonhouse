services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # ensure this file exists and is chmod 600 (see notes below)
      - ./letsencrypt/acme.json:/letsencrypt/acme.json
    labels:
      # HTTP -> HTTPS redirect for everything
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks: [web]
    restart: unless-stopped

  app:
    build: .
    container_name: nextapp
    env_file: .env
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"

      # ✅ Traefik v3: use OR between hosts
      - "traefik.http.routers.next.rule=Host(`texagonui.esm.name.ng`) || Host(`texagon.epichouse.online`)"
      - "traefik.http.routers.next.entrypoints=websecure"
      - "traefik.http.routers.next.tls=true"
      - "traefik.http.routers.next.tls.certresolver=le"
      - "traefik.http.routers.next.service=next"

      # Optional: pre-announce both names for a single cert
      - "traefik.http.routers.next.tls.domains[0].main=texagonui.esm.name.ng"
      - "traefik.http.routers.next.tls.domains[0].sans=texagon.epichouse.online"

      # App's internal port
      - "traefik.http.services.next.loadbalancer.server.port=3000"
    networks: [web]
    depends_on: [traefik]
    restart: unless-stopped

networks:
  web:
    external: false
