services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    labels:
      # Redirect all plain HTTP to HTTPS
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    networks: [web]
    restart: unless-stopped

  app:
    build: .
    container_name: nextapp
    env_file: .env
    labels:
      - "traefik.enable=true"

      # HTTPS router for both hostnames (Traefik will request/renew certs via Let's Encrypt)
      - "traefik.http.routers.next.rule=Host(`texagonui.esm.name.ng`,`texagon.epichouse.online`)"
      - "traefik.http.routers.next.entrypoints=websecure"
      - "traefik.http.routers.next.tls.certresolver=le"
      - "traefik.http.routers.next.service=next"

      # Internal service (container's port)
      - "traefik.http.services.next.loadbalancer.server.port=3000"

      # (Optional but helpful if multiple networks exist)
      - "traefik.docker.network=web"
    networks: [web]
    depends_on: [traefik]
    restart: unless-stopped

networks:
  web:
    external: false
