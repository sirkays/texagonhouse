version: "3.9"

services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443

      # Let's Encrypt (TLS-ALPN/HTTP-01 via TLS challenge here)
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt

    labels:
      # HTTP -> HTTPS redirect (catch-all)
      - traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)
      - traefik.http.routers.http-catchall.entrypoints=web
      - traefik.http.routers.http-catchall.middlewares=redirect-to-https
      - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https

    networks: [web]

  app:
    build: .
    container_name: nextapp
    env_file: .env
    labels:
      - traefik.enable=true

      # Route HTTPS traffic for your domains to this container
      - traefik.http.routers.next.rule=Host(`texagonui.esm.name.ng`)
      - traefik.http.routers.next.entrypoints=websecure
      - traefik.http.routers.next.tls.certresolver=le

      # App listens on 3000 inside the container
      - traefik.http.services.next.loadbalancer.server.port=3000

    networks: [web]
    depends_on: [traefik]

networks:
  web:
    external: false
